services:
  db:
    image: postgres:17
    container_name: lifestyle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: lifestyle
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: lifestyle_os

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: